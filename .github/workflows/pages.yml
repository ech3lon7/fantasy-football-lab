name: Verify and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      # Branch/Jekyll publishing can overwrite the built app with raw source HTML.
      - name: Require GitHub Actions as the Pages source
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pages_build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          if [ "$pages_build_type" != "workflow" ]; then
            echo '::error::Set Settings > Pages > Build and deployment > Source to GitHub Actions. Branch/Jekyll publishing can overwrite the compiled app.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Use the same complete gate locally and in CI, including the Pages base path and all browser cases.
      - name: Verify release
        run: npm run verify:release
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      # Retain browser traces and error context when the gate fails; never deploy failed checks.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-browser-tests
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      # Verify the public artifact, since successful local tests cannot detect a wrong publisher.
      - name: Verify published app assets
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-pages.mjs "$PAGES_URL" "$GITHUB_SHA"
